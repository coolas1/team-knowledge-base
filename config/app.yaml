# 各配置项详细说明:docs/config-reference.md
engine:
  impl: graphrag
  config: config/engine/graphrag
  # tkb_* 工具负载上限:env 前缀 ENGINE_TOOLS_(Rest API 不受限,仅 MCP 工具层)。
  ingest:
    vector_only: true
    chunk_concurrency: 4
    doc_concurrency: 2
    # 模型端点瞬时失败的有界重试(指数退避+抖动,上限 30s;retries=0 关闭)。
    llm_retries: 3
    llm_backoff_base_seconds: 2
  memory:
    enabled: true
    fact_cache_capacity: 256
    fact_cache_ttl_seconds: 1800
    fact_context_limit: 8
    fact_context_max_tokens: 1200
    retain_chunk_concurrency: 4
    entity_resolution_max_concurrent: 8
    entity_resolution_timeout_seconds: 60
    graph_worker: true
    consolidation_batch_size: 32
    consolidation_max_iterations: 100
    consolidation_max_tokens: 3200000
    consolidation_llm_timeout_seconds: 300
    consolidation_lease_seconds: 720
    features:
      scope: true
      reliable_retention: true
      entity_resolution: true
      consolidation: true
      evidence_retrieval: true
      mental_models: true
      adaptive_reflect: true
plugin:
  impl: tkb
archive:
  # 自动归档流水线（workspace 路径来自 ARCHIVE_WORKSPACE_DIR env）。
  # 二态分流: confidence >= threshold 自动执行，否则给出推荐等待确认。
  enabled: true
  threshold: 0.75
  delta: 0.10  # V1 配置兼容，V2 不参与分流
  review_all: false
  poll_seconds: 5
  stability_checks: 2
  max_attempts: 5
  top_k: 5
  collision_policy: suffix

# 目录监控配置
watch:
  enabled: true          # 是否启用目录监控（设为 true 后重启生效）
  directories:
    # - path: "D:/docs"
    #   recursive: true
    # - path: "D:/notes"
    #   recursive: true
    - path: "D:\\study\\activity\\RAG\\knowledge"
      recursive: true
  exclude_patterns:
    - "*.tmp"
    - ".git/**"
    - "node_modules/**"
    - "versions/**"       # 版本快照目录
    - "~$*"              # Office 临时文件
    - "*.swp"            # Vim 临时文件
    - ".DS_Store"
  pipeline:
    schedule_hours: 12   # 自动同步间隔（小时），0 表示禁用定时同步
    enabled: true        # 是否启用定时同步

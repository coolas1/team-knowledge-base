embedding:
  provider: ollama           # ollama | openai | custom
  model: nomic-embed-text    # 当前模型
  dimensions: 768
  base_url: http://localhost:11434

gatekeeper:
  provider: sentence-transformers
  model: BAAI/bge-reranker-v2-m3
  threshold: 0.01            # reranker 分数阈值（raw logits）
  top_n: 10                  # reranker 后保留 Top-N

llm:
  provider: openai             # 使用 OpenAI 兼容接口
  model: qwen-turbo            # DashScope Qwen-Turbo
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ""                  # 从 .env 的 LLM_API_KEY 读取

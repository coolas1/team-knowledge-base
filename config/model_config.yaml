embedding:
  provider: dashscope          # dashscope | ollama
  model: text-embedding-v3    # DashScope 中文优化 embedding
  dimensions: 1024
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

gatekeeper:
  provider: dashscope          # dashscope | local
  model: qwen3-rerank          # DashScope Reranker API（gte-rerank 已于 2026-05-30 下线）
  threshold: 0.01              # reranker 分数阈值
  top_n: 15                    # reranker 后保留 Top-N

llm:
  provider: openai             # 使用 OpenAI 兼容接口
  model: qwen-turbo            # DashScope Qwen-Turbo
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ""                  # 从 .env 的 LLM_API_KEY 读取

vlm:
  model: qwen-vl-plus          # DashScope 视觉语言模型
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ""                  # 从 .env 的 LLM_API_KEY 读取

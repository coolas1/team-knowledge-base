embedding:
  provider: ollama           # ollama | openai | custom
  model: nomic-embed-text    # 当前模型
  dimensions: 768
  base_url: http://localhost:11434

gatekeeper:
  provider: sentence-transformers
  model: BAAI/bge-reranker-v2-m3
  threshold: 0.01            # reranker 分数阈值（raw logits）
  top_n: 10                  # reranker 后保留 Top-N

llm:
  provider: ollama             # 完全本地运行，使用 GPU Ollama
  model: qwen3:14b             # 适配本机 24GB 显存
  base_url: http://localhost:11434
  api_key: ""

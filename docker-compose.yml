# Team Knowledge Base — full stack + benchmark.
#
# Services:
#   postgres / neo4j   — backing services (always)
#   webapp              — FastAPI BFF + built SPA (always)
#   bench               — benchmark runner (profile: bench)
#
# All credentials/ports are sourced from .env.
#
# Quick start:
#   docker compose up -d                    # app + backing services
#   docker compose --profile bench up -d    # + benchmark runner
#   docker compose run bench ingest          # ingest test corpus
#   docker compose run bench qa-bench        # run QA benchmark
#   docker compose run bench file-bench      # run file-update benchmark

services:
  # ── Backing services ──────────────────────────────────────────────────────

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: kb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5
    container_name: kb-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ── Application ────────────────────────────────────────────────────────────

  webapp:
    build:
      context: .
      dockerfile: Containerfile
    image: team-kb-webapp:latest
    container_name: kb-webapp
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-todo}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Benchmark corpus + eval suites (read-only)
      - ./bench/raw:/data/raw:ro
      - ./bench/eval:/data/eval:ro
      # Benchmark output
      - benchdata:/data/output:rw
    restart: unless-stopped

  # ── Benchmark runner (profile: bench) ──────────────────────────────────────

  bench:
    image: team-kb-webapp:latest
    container_name: kb-bench
    profiles: ["bench"]
    depends_on:
      webapp:
        condition: service_started
    environment:
      TKB_BASE_URL: http://webapp:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    volumes:
      - ./bench:/bench:ro
      - benchdata:/data/output:rw
    working_dir: /bench
    entrypoint: ["/bin/bash", "-c"]
    command: ["echo 'Bench runner ready. Use: docker compose run bench <command>'; sleep infinity"]
    restart: "no"

volumes:
  pgdata:
  neo4jdata:
  benchdata:

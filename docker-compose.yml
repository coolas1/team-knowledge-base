# Team Knowledge Base - backing services + webapp.
#
# Postgres+pgvector, Neo4j, Ollama, and the webapp are provisioned here. The
# webapp (BFF + built SPA) runs the engine in-process and reaches all backing
# services over the compose network.
#
# All credentials/ports are sourced from .env, which compose loads
# automatically for variable substitution (and the app loads via pydantic-settings).

name: team-kb

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: team-kb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_pass}
    ports:
      # host port (from .env) -> container's fixed 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5
    container_name: team-kb-neo4j
    environment:
      # Initial password is set only on first init of an empty /data volume.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      # bolt (app) + browser (http UI). Host ports come from .env; keep the bolt
      # port consistent with the port embedded in NEO4J_URI.
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: team-kb-ollama
    # gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Containerfile
    image: team-kb-webapp:latest
    container_name: team-kb-webapp
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # Inside the compose network the backing services are reached by name on
      # their internal ports (5432 / 7687), NOT the host-published ports.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Chat/analysis LLM (was in model_config.yaml; now env-driven).
      LLM_PROVIDER: ${LLM_PROVIDER:-todo}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      # Reranker (search gatekeeper).
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY}
      # Hindsight -> Neo4j projection is opt-in. PostgreSQL remains authoritative.
      HINDSIGHT_GRAPH_WORKER_ENABLED: ${HINDSIGHT_GRAPH_WORKER_ENABLED:-false}
      HINDSIGHT_GRAPH_WORKER_POLL_SECONDS: ${HINDSIGHT_GRAPH_WORKER_POLL_SECONDS:-1}
      HINDSIGHT_GRAPH_WORKER_LEASE_SECONDS: ${HINDSIGHT_GRAPH_WORKER_LEASE_SECONDS:-300}
      HINDSIGHT_GRAPH_WORKER_MAX_ATTEMPTS: ${HINDSIGHT_GRAPH_WORKER_MAX_ATTEMPTS:-10}
      # Fixed BFF upstream; no model credentials are exposed to the browser.
      PI_AGENT_URL: http://pi-agent:8010
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Reuse the host HuggingFace cache: the reranker loads
      # BAAI/bge-reranker-v2-m3 in offline mode, so the model must already be
      # cached on the host (it is, if the host app has run search).
      # ${HOME} is read from your shell. (podman-compose 1.x can't expand $HOME
      # inside a .env value or a ${VAR:-default}, so reference it directly here.)
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped

  pi-agent:
    build:
      context: ./src/extensions/pi-agent
      dockerfile: Containerfile
    image: team-kb-pi-agent:latest
    container_name: team-kb-pi-agent
    depends_on:
      webapp:
        condition: service_started
    environment:
      # Pi is disabled by default through the profile above. Inside Compose it
      # reaches the existing Engine MCP endpoint and Ollama by service name.
      TKB_MCP_URL: http://webapp:8000/mcp/
      TKB_CONTRACT_STRICT: ${TKB_CONTRACT_STRICT:-true}
      TKB_CONNECT_TIMEOUT_MS: ${TKB_CONNECT_TIMEOUT_MS:-10000}
      TKB_TOOL_TIMEOUT_MS: ${TKB_TOOL_TIMEOUT_MS:-60000}
      TKB_DEEP_TOOL_TIMEOUT_MS: ${TKB_DEEP_TOOL_TIMEOUT_MS:-300000}
      PI_AGENT_HOST: 0.0.0.0
      PI_AGENT_PORT: "8010"
      PI_AGENT_CWD: /app
      PI_AGENT_DATA_DIR: /app/data
      PI_AGENT_SESSION_DIR: /app/data/sessions
      # Explicit PI_AGENT_* values win. When omitted, the runtime inherits the
      # already configured LLM_* API; disabled placeholders fall back to Ollama.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PI_AGENT_PROVIDER: ${PI_AGENT_PROVIDER:-}
      PI_AGENT_MODEL: ${PI_AGENT_MODEL:-}
      PI_AGENT_MODEL_NAME: ${PI_AGENT_MODEL_NAME:-}
      PI_AGENT_API: ${PI_AGENT_API:-openai-completions}
      PI_AGENT_BASE_URL: ${PI_AGENT_BASE_URL:-}
      PI_AGENT_API_KEY: ${PI_AGENT_API_KEY:-}
      PI_AGENT_REASONING: ${PI_AGENT_REASONING:-true}
      PI_AGENT_THINKING_LEVEL: ${PI_AGENT_THINKING_LEVEL:-medium}
      PI_AGENT_EXPOSE_THINKING: ${PI_AGENT_EXPOSE_THINKING:-false}
      PI_AGENT_EXPOSE_TOOL_RESULTS: ${PI_AGENT_EXPOSE_TOOL_RESULTS:-false}
      PI_AGENT_CONTEXT_WINDOW: ${PI_AGENT_CONTEXT_WINDOW:-32768}
      PI_AGENT_MAX_OUTPUT_TOKENS: ${PI_AGENT_MAX_OUTPUT_TOKENS:-8192}
      PI_AGENT_MAX_TOOL_CALLS: ${PI_AGENT_MAX_TOOL_CALLS:-12}
      PI_AGENT_MAX_RUN_SECONDS: ${PI_AGENT_MAX_RUN_SECONDS:-300}
      PI_AGENT_MAX_LOADED_SESSIONS: ${PI_AGENT_MAX_LOADED_SESSIONS:-50}
      PI_AGENT_MAX_REQUEST_BYTES: ${PI_AGENT_MAX_REQUEST_BYTES:-1048576}
    ports:
      - "127.0.0.1:${PI_AGENT_PORT:-8010}:8010"
    volumes:
      - piagentdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  ollamadata:
  piagentdata:

# Team Knowledge Base - backing services.
#
# Brings up the two stateful dependencies the graphrag engine needs:
#   - Postgres 16 + pgvector  (vector + pg_trgm extensions are created by the app's init_db())
#   - Neo4j 5                 (standard Cypher only; no APOC required)
#
# Ollama is NOT managed here - it runs externally. Point the app at it via
# OLLAMA_BASE_URL in .env (see .env.example).
#
# The app itself (engine CLI/MCP, BFF, SPA) runs on the host via `uv` / `npm`
# and connects to these services on localhost at the published ports.
#
# All credentials and ports are sourced from .env, which compose loads
# automatically for variable substitution (and the app loads via pydantic-settings).

services:
  postgres:
    # Fully-qualified name for docker/podman compatibility (podman rejects short names).
    image: docker.io/pgvector/pgvector:pg16
    container_name: kb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_pass}
    ports:
      # host port (from .env) -> container's fixed 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-knowledge_base}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    # Fully-qualified name for docker/podman compatibility (podman rejects short names).
    image: docker.io/library/neo4j:5
    container_name: kb-neo4j
    environment:
      # Initial password is set only on first init of an empty /data volume.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      # bolt (app) + browser (http UI). Host ports come from .env; keep the bolt
      # port consistent with the port embedded in NEO4J_URI.
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
